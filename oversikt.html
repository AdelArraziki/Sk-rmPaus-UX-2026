<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Översikt – Skärmpaus</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .overview-page {
      max-width: 650px;
      margin: 0 auto;
      padding: 30px 20px;
      color: #254b3b;
    }

    .overview-page h1,
    .overview-page h2 {
      text-align: center;
    }

    .overview-subtitle {
      text-align: center;
      color: #69746d;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 30px;
    }

    .stat-card {
      background: #e4ecdf;
      border-radius: 18px;
      padding: 24px 12px;
      text-align: center;
    }

    .stat-number {
      font-size: 36px;
      font-weight: bold;
      display: block;
    }

    .stat-label {
      font-size: 14px;
    }

    .weekly-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      margin-top: 25px;
    }

    .weekly-chart {
      display: flex;
      align-items: end;
      justify-content: space-around;
      height: 180px;
      gap: 10px;
    }

    .day {
  text-align: center;
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.bar {
  background: #8aaf91;
  border-radius: 8px 8px 0 0;
  height: 0px;
  width: 70%;
  margin: auto auto 8px;
  margin-top: 0;
  flex-shrink: 0;
}

    .back-link {
      display: block;
      text-align: center;
      margin-top: 30px;
      color: #254b3b;
    }

    .period-buttons {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
}

.period-buttons button {
  padding: 10px 24px;
  border: 1px solid #8aaf91;
  border-radius: 25px;
  background: white;
  color: #254b3b;
  cursor: pointer;
  font-size: 15px;
}

.period-buttons button.active {
  background: #8aaf91;
  color: white;
}

.period-buttons button:hover {
  background: #dce9df;
  color: #254b3b;
}
/* Anpassa diagrammet för månad */
.weekly-chart {
  width: 100%;
  min-width: 0;
}

.weekly-chart.month-view {
  gap: 2px;
  justify-content: space-between;
}

.month-view .day {
  min-width: 0;
  font-size: 10px;
}

.month-view .bar {
  width: 75%;
  max-width: 18px;
}

.chart-navigation {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 15px;
}

.chart-navigation h2 {
  margin: 0;
  text-align: center;
}

.chart-navigation button {
  background: #e6efe8;
  border: 1px solid #c5d8c9;
  border-radius: 50%;
  width: 38px;
  height: 38px;
  cursor: pointer;
  font-size: 18px;
  color: #254b3b;
}

.chart-navigation button:hover {
  background: #cfe3d4;
}

  </style>
</head>

<body>

    <a class="tab is-disabled" href="#"

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"></path>

    <a class="tab is-active" href="oversikt.html"
       aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"

           stroke-width="2" stroke-linecap="round">
        <path d="M4 20V12M10 20V5M16 20V9M22 20V3"></path>

    <a href="index.html" class="back-home">
        ← Tillbaka
    </a>
  <main class="overview-page">
    <h1>Din översikt</h1>
    <p class="overview-subtitle">
      Lite mindre scroll. Lite mer liv.

    </p>
    <p class="user-greeting" id="user-greeting" hidden></p>
    
    

    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-number" id="total-pauses">0</span>
        <span class="stat-label">Genomförda pauser</span>
      </div>

      <div class="stat-card">
        <span class="stat-number" id="total-minutes">0</span>
        <span class="stat-label">Pausminuter</span>
      </div>

      <div class="stat-card">
        <span class="stat-number" id="today-pauses">0</span>
        <span class="stat-label">Pauser idag</span>
      </div>

      <div class="stat-card">
        <span class="stat-number" id="streak-days">0</span>
        <span class="stat-label">Dagar i följd</span>
      </div>
    </section>

    <section class="weekly-card">
        <div class="chart-navigation">
            <button type="button" id="prev-period" aria-label="Föregående period">
              ❮
            </button>
          
            <h2 id="chart-title">Denna vecka</h2>
          
            <button type="button" id="next-period" aria-label="Nästa period">
              ❯
            </button>
          </div>

        <div class="period-buttons">
          <button type="button" id="week-btn" class="active">
            Vecka
          </button>
          <button type="button" id="month-btn">
            Månad
          </button>
        </div>

      <div class="weekly-chart" id="weekly-chart">
        <div class="day"><div class="bar"></div>Mån</div>
        <div class="day"><div class="bar"></div>Tis</div>
        <div class="day"><div class="bar"></div>Ons</div>
        <div class="day"><div class="bar"></div>Tor</div>
        <div class="day"><div class="bar"></div>Fre</div>
        <div class="day"><div class="bar"></div>Lör</div>
        <div class="day"><div class="bar"></div>Sön</div>
      </div>
    </section>

    <a class="back-link" href="index.html">
      ← Till startsidan
    </a>
  </main>

  <script src="oversikt.js"></script>
</body>
</html>
