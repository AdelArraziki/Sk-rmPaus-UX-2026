
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#f8f7f2">

  <title>Välkommen till Skärmfrid</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #173e30;
    }

    .welcome-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eef2f8;
      padding: 16px;
    }

    .welcome-content {
      position: relative;
      isolation: isolate;

      width: 100%;
      max-width: 420px;
      min-height: min(740px, calc(100dvh - 32px));

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;

      padding: 70px 22px 32px;

      background: #f8f7f2;
      border: 1px solid #e5e5dc;
      border-radius: 26px;

      overflow: hidden;
    }

    /* Språkval */

    .welcome-language {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 44px;
      height: 44px;

      border: 1px solid #dce5dd;
      border-radius: 50%;

      background: #ffffff;
      color: #285b48;
      font-size: 22px;
      cursor: pointer;
    }

    /* Bildsektion */

    .welcome-hero {
      position: relative;
      width: 100%;
      height: 245px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
      margin-bottom: 6px;
    }

    .welcome-hero::before {
      content: "";
      position: absolute;

      width: 290px;
      height: 235px;

      top: 0;
      left: 50%;
      transform: translateX(-50%);

      background: #e7eddf;
      border-radius: 48% 52% 45% 55%;

      z-index: -1;
    }

    .welcome-hero::after {
      content: "";
      position: absolute;

      width: 115%;
      height: 75px;

      bottom: 0;
      left: -7.5%;

      background: #dce5d4;
      border-radius: 55% 45% 50% 40%;

      z-index: -1;
    }

    .welcome-image {
      position: relative;
      z-index: 1;

      display: block;

      width: 220px;
      height: 220px;
      max-width: 100%;

      object-fit: cover;
      object-position: center;

      border-radius: 50%;
      box-shadow: 0 10px 25px rgba(35, 75, 55, 0.08);
    }

    /* Bladsymbol */

    .welcome-leaf {
      margin: 10px 0 8px;
      font-size: 30px;
      line-height: 1;
    }

    /* Rubrik */

    .welcome-title {
      margin: 0 0 12px;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 42px;
      font-weight: 500;
      letter-spacing: 0.5px;

      color: #173e30;
    }

    .welcome-slogan {
      margin: 0;

      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      line-height: 1.6;

      color: #426653;
    }

    /* Introduktion */

    .welcome-divider {
      width: 55px;
      height: 2px;
      margin: 28px 0 23px;
      background: #a8bba6;
      border-radius: 5px;
    }

    .welcome-heading {
      margin: 0 0 12px;

      font-size: 23px;
      font-weight: 700;
      line-height: 1.35;

      color: #173e30;
    }

    .welcome-description {
      max-width: 300px;
      margin: 0;

      font-size: 15px;
      line-height: 1.7;

      color: #596d62;
    }

    /* Dekorativa prickar */

    .welcome-dots {
      display: flex;
      justify-content: center;
      gap: 10px;

      margin-top: 28px;
    }

    .welcome-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d4dcd1;
    }

    .welcome-dots span.active {
      background: #285b48;
    }

    /* Kom igång */

    .welcome-start {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;

      width: 100%;
      max-width: 320px;
      min-height: 54px;

      margin-top: auto;
      padding: 14px 20px;

      border-radius: 32px;

      background: #285b48;
      color: #ffffff;

      text-decoration: none;
      font-size: 16px;
      font-weight: 600;

      transition: background 0.2s ease;
    }

    .welcome-start:hover {
      background: #1e4536;
    }

    .welcome-start:focus-visible,
    .welcome-language:focus-visible {
      outline: 3px solid #d59b52;
      outline-offset: 4px;
    }

    .welcome-arrow {
      font-size: 22px;
      line-height: 1;
    }

    /* Mobilanpassning */

    @media (max-width: 390px) {
      .welcome-content {
        padding: 65px 18px 25px;
      }

      .welcome-hero {
        height: 215px;
      }

      .welcome-hero::before {
        width: 250px;
        height: 205px;
      }

      .welcome-image {
        width: 195px;
        height: 195px;
      }

      .welcome-title {
        font-size: 37px;
      }

      .welcome-heading {
        font-size: 21px;
      }

      .welcome-description {
        font-size: 14px;
      }

      .welcome-divider {
        margin: 22px 0 18px;
      }

      .welcome-dots {
        margin-top: 22px;
      }
    }

    @media (max-height: 720px) {
      .welcome-content {
        min-height: 0;
      }

      .welcome-hero {
        height: 195px;
      }

      .welcome-hero::before {
        height: 185px;
      }

      .welcome-hero::after {
        height: 55px;
      }

      .welcome-image {
        width: 175px;
        height: 175px;
      }

      .welcome-divider {
        margin: 18px 0;
      }

      .welcome-dots {
        margin-top: 18px;
      }

      .welcome-start {
        margin-top: 25px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .welcome-start {
        transition: none;
      }
    }
  </style>
</head>

<body class="welcome-page">

  <main class="welcome-content">

    <!-- Språkval, aktiveras senare -->
    <button
      class="welcome-language"
      type="button"
      aria-label="Språkval kommer snart"
      title="Språkval kommer snart">
      🌐
    </button>

    <!-- Göteborgsbild -->
    <div class="welcome-hero">

      <img
        class="welcome-image"
        src="images/goteborg-alvsborgsbron.png"
        alt="Utsikt över Älvsborgsbron och Göta älv i Göteborg"
      >

    </div>

    <!-- Logotyp -->
    <div class="welcome-leaf" aria-hidden="true">
      🌿
    </div>

    <h1 class="welcome-title">
      Skärmfrid
    </h1>

    <p class="welcome-slogan">
      LITE MINDRE SCROLL. LITE MER LIV.
    </p>

    <!-- Introduktion -->
    <div class="welcome-divider" aria-hidden="true"></div>

    <h2 class="welcome-heading">
      En stund för dig själv.
    </h2>

    <p class="welcome-description">
      Mindre skärmtid, mer tid för det
      som får dig att må bra.
    </p>

    <!-- Dekorativa prickar -->
    <div class="welcome-dots" aria-hidden="true">
      <span class="active"></span>
      <span></span>
      <span></span>
    </div>

    <!-- Till funktionssidan -->
    <a class="welcome-start" href="hem.html">
      <span>Kom igång</span>
      <span class="welcome-arrow" aria-hidden="true">→</span>
    </a>

  </main>

</body>
</html>
