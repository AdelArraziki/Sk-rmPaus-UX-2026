</head>

    <main class="profil-page">
      <h1>Min profil</h1>
      <p>Din personliga pausplats</p>
      <p class="user-greeting" id="user-greeting" hidden></p>

      <section class="profil-card">
        <div class="profil-avatar">👤</div>
        <h2>Personliga uppgifter</h2>

        <label for="profil-namn">Ditt namn</label>
        <input id="profil-namn"
               type="text"
               placeholder="Skriv ditt namn">

               <label for="profil-smeknamn">Smeknamn (valfritt)</label>
<input
  id="profil-smeknamn"
  type="text"
  maxlength="30"
  placeholder="Vad vill du bli kallad?"
>

        <label for="profil-mal">Mitt pausmål per dag</label>
        <select id="profil-mal">
          <option value="15">15 minuter</option>
          <option value="30">30 minuter</option>
          <option value="60">60 minuter</option>
          <option value="120">120 minuter</option>
        </select>
        <label for="profil-paminnelse">Påminn mig efter</label>
<select id="profil-paminnelse">
  <option value="30">30 minuter</option>
  <option value="60">60 minuter</option>
  <option value="90">90 minuter</option>
  <option value="120">120 minuter</option>
</select>

<label for="profil-aktivitet">Min favoritaktivitet</label>
<select id="profil-aktivitet">
  <option value="">Välj aktivitet</option>
  <option value="promenad">Promenad</option>
  <option value="traning">Träning</option>
  <option value="lasa">Läsa en bok</option>
  <option value="musik">Lyssna på musik</option>
  <option value="familj">Tid med familjen</option>
</select>

<label for="profil-plats">Jag föredrar att vara</label>
<select id="profil-plats">
  <option value="bada">Både inne och ute</option>
  <option value="inne">Inomhus</option>
  <option value="ute">Utomhus</option>
</select>

        <button type="button" id="spara-profil">
          Spara profil
        </button>
        <p id="profil-meddelande" role="status"></p>
      </section>
    </main>
  </div>

  <script src="profil.js"></script>
</body>
</html>
