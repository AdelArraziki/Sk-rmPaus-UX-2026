

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktivitetsförslag – Skärmpaus</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .activity-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f5ee;
      color: #254b3b;
    }

    .activity-card {
      width: 100%;
      max-width: 480px;
      padding: 36px 28px;
      text-align: center;
      background: #fffdf8;
      border-radius: 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,.06);
    }

    .activity-card h1 {
      font-family: Georgia, serif;
      font-size: 32px;
    }

    .activity-card h2 {
      font-family: Georgia, serif;
      font-size: 26px;
      margin: 24px 0 12px;
    }

    .activity-card p {
      line-height: 1.6;
    }

    .activity-actions {
      display: grid;
      gap: 12px;
      margin-top: 28px;
    }

    .activity-actions button {
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    .activity-primary {
      background: #254b3b;
      color: white;
      border: none;
    }

    .activity-secondary {
      background: transparent;
      color: #254b3b;
      border: 1px solid #254b3b;
    }

/* Små navigeringsknappar under Starta pausen */

.activity-navigation {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 8px;
}

.activity-nav-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 120px;
  height: 44px;
  padding: 0 10px;
  background: #e7eedc;
  color: #254b3b;
  border: 1px solid #b6c8b6;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  box-sizing: border-box;
  transition: background 0.2s ease;
}


.activity-nav-btn:hover {
  background: #d5e3cd;
}

.activity-nav-btn:focus-visible {
  outline: 3px solid #254b3b;
  outline-offset: 3px;
}

  </style>
</head>
<body class="activity-page">


  
  <main class="activity-card">
    <p>LITE MINDRE SCROLL. LITE MER LIV.</p>
    <p class="user-greeting" id="user-greeting" hidden></p>

    <h1>Din stund börjar här</h1>

    <p id="choice-summary"></p>

    <h2 id="activity-title">Ditt aktivitetsförslag</h2>

    <p id="activity-description">
      Vi hittar något fint att göra under din paus.
    </p>

    <div class="activity-actions">
      <button class="activity-secondary" id="new-tip">
        Byt förslag
      </button>

      <button class="activity-primary" id="start-break">
        Starta pausen
      </button>

<div class="activity-navigation">
  <a href="index.html" class="activity-nav-btn">
    ← Tillbaka
  </a>

  <a href="index.html" class="activity-nav-btn">
    ⌂ Hem
  </a>
</div>

    </div>
  </main>

  <script src="Aktivitetsforslag.js"></script>
</body>
</html>
