
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Aktivitetsförslag – Skärmfrid</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    .activity-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      margin: 0;
      background: #f7f5ee;
      color: #254b3b;
    }

    .activity-card {
      width: 100%;
      max-width: 480px;
      padding: 36px 28px 24px;
      text-align: center;
      background: #fffdf8;
      border-radius: 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,.06);
    }

    .activity-card h1 {
      font-family: Georgia, serif;
      font-size: 32px;
      margin: 0 0 18px;
    }

    .activity-card h2 {
      font-family: Georgia, serif;
      font-size: 26px;
      margin: 24px 0 12px;
    }

    .activity-card p {
      line-height: 1.6;
    }

    .activity-actions {
      display: grid;
      gap: 12px;
      margin-top: 28px;
    }

    .activity-actions button {
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    .activity-primary {
      background: #254b3b;
      color: #ffffff;
      border: none;
      font-weight: 600;
    }

    .activity-primary:hover {
      background: #193d2e;
    }

    .activity-secondary {
      background: transparent;
      color: #254b3b;
      border: 1px solid #254b3b;
    }

    /* Aktivitetslista */

    #activity-select {
      width: 100%;
      min-height: 54px;
      padding: 14px 44px 14px 18px;
      background-color: #e7eedc;
      color: #254b3b;
      border: 1.5px solid #b6c8b6;
      border-radius: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37,75,59,.06);
    }

    #activity-select:hover {
      border-color: #254b3b;
    }

    #activity-select option {
      background: #fffdf8;
      color: #254b3b;
      font-weight: 400;
    }

    /* Tillbaka-pil längst ned till vänster */

    .activity-navigation {
      display: flex;
      justify-content: flex-start;
      margin-top: 24px;
    }

    .activity-back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: #e7eedc;
      color: #254b3b;
      border: 1px solid #b6c8b6;
      border-radius: 50%;
      font-size: 24px;
      font-weight: 500;
      text-decoration: none;
      transition: background .2s ease;
    }

    .activity-back-btn:hover {
      background: #d5e3cd;
    }

    .activity-back-btn:focus-visible,
    #activity-select:focus-visible,
    .activity-actions button:focus-visible {
      outline: 3px solid #8eaf91;
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      .activity-page {
        padding: 16px;
      }

      .activity-card {
        padding: 28px 20px 22px;
      }

      .activity-card h1 {
        font-size: 28px;
      }

      .activity-card h2 {
        font-size: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .activity-back-btn {
        transition: none;
      }
    }
  </style>
</head>

<body class="activity-page">

  <main class="activity-card">

    <p
      class="user-greeting"
      id="user-greeting"
      hidden>
    </p>

    <h1>Din stund börjar här</h1>

    <p id="choice-summary"></p>

    <h2 id="activity-title">
      Ditt aktivitetsförslag
    </h2>

    <p id="activity-description">
      Vi hittar något fint att göra under din paus.
    </p>

    <div class="activity-actions">

      <select
        id="activity-select"
        class="activity-secondary"
        aria-label="Välj en annan aktivitet">

        <option value="" disabled selected>
          Välj en annan aktivitet
        </option>

      </select>

      <button
        class="activity-primary"
        id="start-break"
        type="button">
        Starta pausen
      </button>

    </div>

    <!-- Tillbaka till funktionssidan -->
    <nav class="activity-navigation"
         aria-label="Tillbaka">

      <a
        href="hem.html"
        class="activity-back-btn"
        aria-label="Tillbaka till Skärmfrids funktionssida"
        title="Tillbaka">
        <span aria-hidden="true">←</span>
      </a>

    </nav>

  </main>

  <script src="Aktivitetsforslag.js"></script>

</body>
</html>
